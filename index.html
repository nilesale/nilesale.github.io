function factVal(f,o){var v=o[f.k];
 if(f.kind==='make')return bName(dsOf(f.ds),v);
 if(f.kind==='model')return mName(dsOf(f.ds),o[f.bf||'make'],v);
 if(f.kind==='year')return v?dg(v):'';
 if(f.kind==='trim')return trimLabel(o);
 if(f.kind==='wref')return wrefLabel(o);
 if(f.kind==='pcmodel')return pcModelLabel(o);
 if(f.kind==='gtype')return gtOne(v);
 if(f.kind==='gbrand')return bName(PC_C,v);
 if(f.kind==='num'){if(v===''||v==null)return '';if(f.fmt==='hours')return plN('hours',v);if(f.fmt==='km')return num(v)+' '+t('kmU');if(f.fmt==='feddan')return num(v)+' '+(lang==='en'&&Number(v)!==1?t('feddansU'):t('feddanU'));if(f.fmt==='area')return num(v)+' '+t('sqm');if(f.fmt==='pct')return num(v)+t('pctU');return num(v);}
 if(f.kind==='sel'){if(f.fmt==='cyl'){var ck=keyOf('cyl',v);return !ck?'':ck==='ev'?lab('cyl',v):dg(ck);}return lab(f.opts,v);}
 if(f.kind==='letters')return (o.letters||[]).join(' ');
 if(f.kind==='pnum')return v?toAr(v):'';
 if(f.kind==='mob')return v?dg(v):'';
 if(f.kind==='text')return v?(f.digits?dg(v):v):'';
 return '';}
